server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com; # TODO: CHANGE THIS

    # ACME-challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yourdomain.com; # TODO: CHANGE THIS

    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem; # TODO: Change domain name
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem; # TODO: Change domain name

    # Security Headers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://bot:3000; # 'bot' is the service name, 3000 is the app port
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}